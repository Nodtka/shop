<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Starsbot Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 15px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #111; padding: 5px; border-radius: 12px; overflow-x: auto; }
        .tab { flex: none; width: 80px; text-align: center; padding: 10px; border-radius: 10px; cursor: pointer; color: #555; font-size: 13px; font-weight: bold; }
        .tab.active { background: #3b82f6; color: #fff; }
        .card { background: #0a0a0a; padding: 18px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        .price { color: #facc15; font-weight: 800; }
        .btn { background: #3b82f6; color: #fff; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #3b82f6; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
        .page { display: none; } .active-page { display: block; }
    </style>
</head>
<body>
    <div id="page_selection" class="page active-page">
        <div class="tabs">
            <div id="t_stars" class="tab active" onclick="switchTab('stars')">Stars</div>
            <div id="t_prem" class="tab" onclick="switchTab('premium')">Premium</div>
            <div id="t_nft" class="tab" onclick="switchTab('nft')">NFT</div>
        </div>
        <div id="stars_sec">
            <div class="card" onclick="goToStep2('50 Stars', 12500)"><span>50 Stars</span><span class="price">12 500</span></div>
            <div class="card" onclick="goToStep2('250 Stars', 62500)"><span>250 Stars</span><span class="price">62 500</span></div>
            <div class="card" onclick="goToStep2('500 Stars', 125000)"><span>500 Stars</span><span class="price">125 000</span></div>
        </div>
        <div id="prem_sec" style="display:none">
            <div class="card" onclick="goToStep2('Premium 1 год', 400000)"><span>12 месяцев</span><span class="price">400 000</span></div>
        </div>
        <div id="nft_sec" style="display:none">
            <div class="card" onclick="goToStep2('NFT Подарок', 1200000)"><span>NFT Подарок</span><span class="price">1 200 000</span></div>
        </div>
    </div>

    <div id="page_nick" class="page">
        <h3>Куда отправить?</h3>
        <input type="text" id="user_nick" placeholder="@username">
        <button class="btn" onclick="goToStep3()">Далее к оплате</button>
    </div>

    <div id="page_pay" class="page">
        <h3>Оплата</h3>
        <div style="background:#0a0a0a; padding:20px; border-radius:15px; border: 1px dashed #3b82f6; text-align:center;">
            <p>Карта: <code>5614682111995470</code></p>
            <p id="final_info" style="color:#facc15; font-weight:bold;"></p>
        </div>
        <button class="btn" onclick="finishOrder()">Я ОПЛАТИЛ(А)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp; let order = {};
        function switchTab(t) {
            document.getElementById('stars_sec').style.display = t === 'stars' ? 'block' : 'none';
            document.getElementById('prem_sec').style.display = t === 'premium' ? 'block' : 'none';
            document.getElementById('nft_sec').style.display = t === 'nft' ? 'block' : 'none';
            ['t_stars','t_prem','t_nft'].forEach(id => document.getElementById(id).classList.remove('active'));
            document.getElementById('t_'+t).classList.add('active');
        }
        function goToStep2(n, p) { order.n = n; order.p = p + Math.floor(Math.random()*500); showPage('page_nick'); }
        function goToStep3() {
            order.nick = document.getElementById('user_nick').value;
            if(!order.nick) return alert('Ник!');
            document.getElementById('final_info').innerText = `${order.n} - ${order.p} сум для ${order.nick}`;
            showPage('page_pay');
        }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.getElementById(id).classList.add('active-page'); }
        function finishOrder() { tg.sendData(`${order.p}|${order.n}|${order.nick}`); tg.close(); }
    </script>
</body>
</html>
