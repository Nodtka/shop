<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Starsbot Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 15px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #1e293b; padding: 6px; border-radius: 14px; border: 1px solid #334155; }
        .tab { flex: 1; text-align: center; padding: 12px; border-radius: 10px; cursor: pointer; color: #94a3b8; font-weight: 600; }
        .tab.active { background: #3b82f6; color: white; }
        .card { background: #1e293b; padding: 18px; border-radius: 18px; margin-bottom: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .price { color: #facc15; font-size: 18px; font-weight: bold; }
        .btn { background: #3b82f6; color: white; border: none; padding: 16px; border-radius: 14px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-pay { background: #22c55e; }
        input { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; margin-bottom: 12px; font-size: 16px; }
        .page { display: none; } .active-page { display: block; }
        code { background: #020617; padding: 12px; border-radius: 10px; display: block; text-align: center; margin: 10px 0; border: 1px dashed #3b82f6; color: #60a5fa; font-size: 18px; }
    </style>
</head>
<body>
    <div id="main_page" class="page active-page">
        <div class="tabs">
            <div id="t_stars" class="tab active" onclick="switchTab('stars')">Stars</div>
            <div id="t_prem" class="tab" onclick="switchTab('premium')">Premium</div>
        </div>
        <div id="stars_sec">
            <div class="card" onclick="openPay('50 Stars', 12500)"><div>50 Stars</div><div class="price">12 500</div></div>
            <div class="card" onclick="openPay('100 Stars', 25000)"><div>100 Stars</div><div class="price">25 000</div></div>
            <div class="card" onclick="openPay('250 Stars', 62500)"><div>250 Stars</div><div class="price">62 500</div></div>
            <div style="margin-top:20px;">
                <input type="number" id="custom_s" placeholder="Своё кол-во (минимум 50)" oninput="recalc()">
                <div id="custom_res" class="price" style="text-align:center; margin-bottom:10px; display:none;"></div>
                <button class="btn" id="custom_btn" style="display:none" onclick="payCustom()">Купить звёзды</button>
            </div>
        </div>
        <div id="prem_sec" style="display:none">
            <div class="card" onclick="openPay('Premium 3 месяца', 180000)"><div>3 месяца</div><div class="price">180 000</div></div>
            <div class="card" onclick="openPay('Premium 6 месяцев', 230000)"><div>6 месяцев</div><div class="price">230 000</div></div>
            <div class="card" onclick="openPay('Premium 1 год', 400000)"><div>1 год</div><div class="price">400 000</div></div>
        </div>
    </div>

    <div id="pay_page" class="page">
        <div id="pay_container">
            <h2 style="text-align:center">Оплата</h2>
            <div class="card" style="flex-direction:column; align-items:flex-start;">
                <p>Товар: <b id="p_name"></b></p>
                <p>Сумма: <b id="p_price" class="price"></b></p>
                <code id="card_num">5614682111995470</code>
                <button class="btn" style="background:#475569" onclick="copyCard()">Копировать карту</button>
            </div>
            <input type="text" id="u_nick" placeholder="@username получателя">
            <button class="btn btn-pay" onclick="confirmPay()">Я оплатил(а)</button>
            <button class="btn" style="background:none; color:#94a3b8" onclick="location.reload()">Назад</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand(); let order = { name: "", price: 0 };
        function switchTab(t) {
            document.getElementById('stars_sec').style.display = t === 'stars' ? 'block' : 'none';
            document.getElementById('prem_sec').style.display = t === 'premium' ? 'block' : 'none';
            document.getElementById('t_stars').classList.toggle('active', t === 'stars');
            document.getElementById('t_prem').classList.toggle('active', t === 'premium');
        }
        function recalc() {
            let v = document.getElementById('custom_s').value;
            let res = document.getElementById('custom_res');
            let btn = document.getElementById('custom_btn');
            if(v >= 50) {
                res.innerText = (v * 250).toLocaleString().replace(/,/g, ' ') + " сум";
                res.style.display = 'block'; btn.style.display = 'block';
            } else { res.style.display = 'none'; btn.style.display = 'none'; }
        }
        function payCustom() { openPay(document.getElementById('custom_s').value + " Stars", document.getElementById('custom_s').value * 250); }
        function openPay(n, p) {
            let r = Math.floor(Math.random() * 999) + 1;
            order = { name: n, price: p + r };
            document.getElementById('p_name').innerText = n;
            document.getElementById('p_price').innerText = order.price.toLocaleString().replace(/,/g, ' ') + " сум";
            document.getElementById('main_page').classList.remove('active-page');
            document.getElementById('pay_page').classList.add('active-page');
        }
        function copyCard() { navigator.clipboard.writeText('5614682111995470'); tg.showAlert("Номер карты скопирован!"); }
        function confirmPay() {
            let nick = document.getElementById('u_nick').value;
            if(nick.length < 3) return tg.showAlert("Введите ник!");
            tg.sendData(order.price + "|" + order.name + "|" + nick);
            document.getElementById('pay_container').innerHTML = `
                <div style="text-align:center;padding:20px">
                    <div style="font-size:60px">✅</div>
                    <h2>Заявка создана!</h2>
                    <p>Товар: <b>${order.name}</b></p>
                    <p>Сумма: <b>${order.price.toLocaleString().replace(/,/g, ' ')} сум</b></p>
                    <p style="color:#facc15"><b>ВАЖНО: Закройте магазин и пришлите скриншот чека боту!</b></p>
                    <button class="btn" onclick="tg.close()">Закрыть магазин</button>
                </div>`;
        }
    </script>
</body>
</html>
