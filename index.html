<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Starsbot Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 15px; }
        .card { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #222; }
        .price { color: #facc15; font-weight: bold; font-size: 18px; }
        .btn { background: #3b82f6; color: #fff; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3b82f6; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 15px; }
        .support-btn { background: #222; border: 1px solid #444; margin-top: 20px; }
        .page { display: none; } .active { display: block; }
    </style>
</head>
<body>
    <div id="shop_page" class="page active">
        <h3>🚀 Выберите количество Stars:</h3>
        <div class="card" onclick="selectItem('50 Stars', 12500)"><div>50 Stars</div><div class="price">12 500 сум</div></div>
        <div class="card" onclick="selectItem('100 Stars', 25000)"><div>100 Stars</div><div class="price">25 000 сум</div></div>
        <div class="card" onclick="selectItem('250 Stars', 62500)"><div>250 Stars</div><div class="price">62 500 сум</div></div>
        <div class="card" onclick="selectItem('500 Stars', 125000)"><div>500 Stars</div><div class="price">125 000 сум</div></div>
        <div class="card" onclick="selectItem('1000 Stars', 250000)"><div>1000 Stars</div><div class="price">250 000 сум</div></div>
        
        <button class="btn support-btn" onclick="window.open('https://t.me/wvwlvl')">👨‍💻 ПОДДЕРЖКА</button>
    </div>

    <div id="pay_page" class="page">
        <h2 style="text-align:center">Оформление</h2>
        <p>Введите @username получателя:</p>
        <input type="text" id="target_user" placeholder="@username">
        
        <div style="background:#111; padding:15px; border-radius:10px; text-align:center">
            <p>Переведите на карту:</p>
            <code style="font-size:18px">5614682111995470</code>
            <p id="order_desc" style="margin-top:15px; color:#facc15"></p>
        </div>
        
        <button class="btn" onclick="confirmPay()">Я ОПЛАТИЛ(А)</button>
        <button class="btn support-btn" onclick="location.reload()">Назад</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let currentItem = {};

        function selectItem(name, price) {
            let rand = Math.floor(Math.random() * 500) + 100; // Для идентификации платежа
            currentItem = { name: name, price: price + rand };
            document.getElementById('order_desc').innerHTML = `${name}<br>Сумма: <b>${currentItem.price} сум</b>`;
            document.getElementById('shop_page').classList.remove('active');
            document.getElementById('pay_page').classList.add('active');
        }

        function confirmPay() {
            let nick = document.getElementById('target_user').value;
            if (nick.length < 3) return tg.showAlert("Введите ник!");
            // Отправляем: Цена|Товар|Ник
            tg.sendData(`${currentItem.price}|${currentItem.name}|${nick}`);
            tg.close();
        }
    </script>
</body>
</html>
