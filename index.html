<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stars Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #000000; --card: #1c1c1e; --blue: #007aff; --white: #ffffff; --gray: #8e8e93; --red: #ff453a; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--white); margin: 0; padding: 16px; -webkit-user-select: none; }
        .page { display: none; } .active { display: block; }
        .section-title { font-size: 20px; font-weight: 700; margin: 20px 0 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #2c2c2e; transition: transform 0.1s; }
        .card:active { transform: scale(0.97); }
        .card b { display: block; font-size: 24px; margin-bottom: 4px; }
        .card span { color: var(--gray); font-size: 14px; font-weight: 600; }
        
        .box { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #2c2c2e; }
        input { width: 100%; box-sizing: border-box; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 12px; color: white; padding: 14px; font-size: 16px; outline: none; margin-top: 8px; }
        
        .payment-sum { background: var(--red); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .sum-val { font-size: 32px; font-weight: 900; margin: 5px 0; }
        .btn-copy { background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 10px; padding: 8px 16px; font-weight: 700; font-size: 13px; margin-top: 8px; }
        
        .karta { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 25px; border: 1px solid #2c2c2e; }
        .btn-main { background: var(--blue); color: white; border: none; border-radius: 16px; padding: 18px; width: 100%; font-size: 17px; font-weight: 700; }
    </style>
</head>
<body>
    <div id="m" class="page active">
        <div class="section-title">Telegram Stars</div>
        <div class="grid">
            <div class="card" onclick="sel('100 Stars', 24000)"><b>100</b><span>24 000 сум</span></div>
            <div class="card" onclick="sel('250 Stars', 60000)"><b>250</b><span>60 000 сум</span></div>
            <div class="card" onclick="sel('500 Stars', 118000)"><b>500</b><span>118 000 сум</span></div>
            <div class="card" onclick="sel('1000 Stars', 235000)"><b>1000</b><span>235 000 сум</span></div>
        </div>
    </div>

    <div id="p" class="page">
        <div class="box">
            <div style="font-size:13px; color:var(--gray); font-weight: 600;">ВАШ @USERNAME / ID</div>
            <input type="text" id="nick" placeholder="@username">
        </div>
        <div class="payment-sum">
            <div style="font-size: 12px; font-weight: 800; opacity: 0.9;">СУММА К ОПЛАТЕ:</div>
            <div class="sum-val" id="fsum">0 сум</div>
            <button class="btn-copy" onclick="cp('fsum', true)">Копировать сумму</button>
        </div>
        <div class="karta">
            <div style="font-family:monospace; font-size:17px; font-weight: 700;">5614 6821 1199 5470</div>
            <button class="btn-copy" style="background:#2c2c2e; color:var(--blue);" onclick="cp('5614682111995470', false)">Копировать</button>
        </div>
        <button class="btn-main" onclick="send()">✅ Я ОПЛАТИЛ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand(); let curP=0, curN="";
        function sel(n, p) { 
            curN=n; curP=p+(Math.floor(Math.random()*899)+100); 
            document.getElementById('fsum').innerText=curP.toLocaleString()+" сум"; 
            document.getElementById('m').classList.remove('active'); document.getElementById('p').classList.add('active'); 
        }
        function cp(v,is){ 
            let t=is?document.getElementById(v).innerText.replace(/[^0-9]/g,''):v; 
            navigator.clipboard.writeText(t); tg.showAlert("Скопировано!"); 
        }
        function send(){ 
            let n=document.getElementById('nick').value; 
            if(n.length<3) return tg.showAlert("Введите ник получателя!"); 
            tg.sendData(`ЗАКАЗ: ${curN} | НИК: ${n} | СУММА: ${curP}`); 
            tg.showAlert("✅ Заявка отправлена! Пришлите скриншот чека в чат."); 
        }
    </script>
</body>
</html>
